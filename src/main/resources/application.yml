# Default/Development configuration — LOCAL ONLY
# Used when no profile is set (.\gradlew bootRun). Railway sets SPRING_PROFILES_ACTIVE (prod / prod,dev) and DATABASE_URL.
# On Railway, Application.kt reads DATABASE_URL and sets datasource URL/username/password; this file is not used for DB.
#
# Local Docker: docker-compose maps 5433:5432, so we use port 5433 to avoid clashing with native Postgres on 5432.
# If you get "password authentication failed for user shifa", set DB_USERNAME/DB_PASSWORD or create user shifa in Postgres.

spring:
  profiles:
    # No SPRING_PROFILES_ACTIVE means "local": application-local.yml (gitignored) is read if present.
    default: local
  datasource:
    url: jdbc:postgresql://localhost:${DB_PORT:5433}/shifa
    username: ${DB_USERNAME:shifa}
    password: ${DB_PASSWORD:shifa}

  jpa:
    # In development, we can use 'update' for convenience
    # In production, this MUST be 'validate' (see application-prod.yml)
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        # Loads lazy to-one/to-many relations of a result list in batches of 50 instead of one query each (P4).
        default_batch_fetch_size: 50
    open-in-view: false  # same as prod, so lazy-loading mistakes show up locally

  data:
    web:
      pageable:
        # Keep the mode the apps were built against (Boot 3.4+ warns that the default may change to via_dto).
        serialization-mode: direct

  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    validate-migration-naming: true
  
  servlet:
    multipart:
      enabled: true
      max-file-size: 25MB
      max-request-size: 25MB

  # Email (Brevo SMTP) for OTP verification
  # In development: emails are logged, not sent (unless SMTP credentials are set)
  # In production: set MAIL_USERNAME and MAIL_PASSWORD env vars with Brevo SMTP credentials
  mail:
    host: ${MAIL_HOST:smtp-relay.brevo.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
    from: ${MAIL_FROM:noreply@shifa.health}
    from-name: ${MAIL_FROM_NAME:Shifa Health}

# Development logging - more verbose
logging:
  level:
    root: INFO
    org.springframework.security: DEBUG
    com.shifa.security.JwtAuthFilter: DEBUG
    com.shifa: DEBUG
  pattern:
    # Request id (X-Request-Id response header, shared/RequestIdFilter) next to the level on every line.
    level: "%5p [rid=%X{requestId:-}]"

server:
  # Use PORT on Railway (or SERVER_PORT), default 8080 for local
  port: ${PORT:${SERVER_PORT:8080}}
  # Let in-flight requests finish during a deploy (up to the phase timeout below) instead of cutting them
  # at once; long SSE streams can still be cut after that window (roadmap 2.4).
  shutdown: graceful

spring.lifecycle.timeout-per-shutdown-phase: 30s

# OpenAPI: sorted output so docs/api/openapi.json (the committed contract, see ApplicationContextTest) diffs cleanly.
springdoc:
  writer-with-order-by-keys: true

# Actuator: same baseline as prod/qa so /actuator/health/liveness exists for every profile (Docker/Railway).
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
  health:
    probes:
      enabled: true
  info:
    env:
      enabled: true

# /actuator/info: the deployed commit, set by Railway at runtime; "local" elsewhere. Used by the release workflow.
info:
  commit: ${RAILWAY_GIT_COMMIT_SHA:local}

# Development configuration
# WARNING: These values are for development only!
# In production, use environment variables (see application-prod.yml)
# SECURITY (NEW): Rate limiting - auth endpoints stricter, general API reasonable
app:
  rate-limit:
    auth:
      requests-per-minute: 10
    general:
      requests-per-minute: 200
    # X-Forwarded-For entries appended by proxies we trust (Railway edge = 1). 0 = first entry, which the client controls.
    trusted-proxy-hops: 0
    ai:
      enabled: ${AI_RATE_LIMIT_ENABLED:true}
      patient-daily-requests: ${AI_RATE_LIMIT_PATIENT_DAILY:30}
      doctor-daily-requests: ${AI_RATE_LIMIT_DOCTOR_DAILY:100}
      patient-burst-per-min: ${AI_RATE_LIMIT_PATIENT_BURST_PER_MIN:10}
      doctor-burst-per-min: ${AI_RATE_LIMIT_DOCTOR_BURST_PER_MIN:20}
      timezone: ${AI_RATE_LIMIT_TIMEZONE:Asia/Tashkent}
  jwt:
    issuer: "shifa"
    # Development secret - MUST be changed in production!
    secret: "a_really_long_random_64+_char_secret_development_only"
    accessTokenMinutesDoctor: 43200   # 30 days for doctor app (login once per month)
    accessTokenMinutesPatient: 525600  # 365 days for patient app
  # In development: Use separate nginx on 8090 or serve from Spring Boot on 8080
  # For Railway: Set PUBLIC_BASE_URL to your Railway app URL (same as API)
  publicBaseUrl: http://localhost:8080  # Changed from 8090 - now served from Spring Boot
  storageRoot: ./public-storage/images
  transcription-feedback-enabled: ${TRANSCRIPTION_FEEDBACK_ENABLED:false}
  # Local only: print OTP codes to the log when SMTP is not configured.
  log-otp-codes: true
  # Private file URLs (patient documents, patient photos, chat attachments) carry exp+sig. Log-only until true.
  file-url-enforce: false
  # Upload allow-list (see shared/UploadPolicy.kt). Log-only until true.
  upload-policy-enforce: false
  # Fail-safe defaults for every profile: 500 bodies name the exception class only, no https redirect.
  # For exception messages in local 500 bodies, copy application-local.example.yml to application-local.yml.
  expose-error-details: false
  enforce-https: false
  # Deterministic test data at startup (devseed/DevSeedRunner). Only application-dev.yml and local overrides turn it on.
  dev-seed: false

# OpenAI configuration
# In development, these can be set via environment variables
# In production, they MUST be set via environment variables
openai:
  apiKey: ${OPENAI_API_KEY:}    # Set in environment or .env file
  projectId: ${OPENAI_PROJECT_ID:}
  model: gpt-4o-mini
  # Most capable REST STT: gpt-4o-transcribe (above gpt-4o-mini-transcribe / whisper-1).
  transcription-model: ${OPENAI_TRANSCRIPTION_MODEL:gpt-4o-transcribe}
  transcription-send-language-param: ${OPENAI_TRANSCRIPTION_SEND_LANG:true}
  transcription-medical-cleanup-enabled: ${OPENAI_TRANSCRIPTION_MED_CLEANUP:true}
  transcription-medical-cleanup-voice-uploads: ${OPENAI_TRANSCRIPTION_MED_CLEANUP_VOICE:false}
  transcription-medical-cleanup-min-words: 10
  transcription-medical-cleanup-model: ${OPENAI_TRANSCRIPTION_MED_CLEANUP_MODEL:gpt-4o-mini}
  url: https://api.openai.com/v1/responses
  temperature: 0.2
  maxTokens: 600
  requestTimeoutMs: 15000
  promptVersion: "1"
  maxRequestsPerMinute: ${OPENAI_GLOBAL_MAX_REQ_PER_MIN:600}
  # Most capable REST TTS: gpt-4o-mini-tts (falls back to tts-1-hd / tts-1 if the project lacks access).
  tts-model: ${OPENAI_TTS_MODEL:gpt-4o-mini-tts}
  tts-voice: ${OPENAI_TTS_VOICE:sage}
  tts-speed: ${OPENAI_TTS_SPEED:0.92}

# Shifa Intelligence LLM routing (provider-agnostic morning assistant).
# A provider is used only when it has a non-blank API key. Missing keys are skipped, so
# OpenAI-only deployments stay OpenAI-only until GEMINI_API_KEY / XAI_API_KEY are set.
# Set GEMINI_ENABLED=false or XAI_ENABLED=false to keep a key without sending traffic.
ai:
  routing:
    enabled: true
    default-provider: openai
    max-provider-attempts: ${AI_MAX_PROVIDER_ATTEMPTS:2}
    request-deadline-ms: ${AI_REQUEST_DEADLINE_MS:40000}
    cooldown-ms: ${AI_PROVIDER_COOLDOWN_MS:60000}
  providers:
    openai:
      enabled: true
      base-url: https://api.openai.com/v1
      api-key: ${OPENAI_API_KEY:}
      project-id: ${OPENAI_PROJECT_ID:}
      chat-model: ${OPENAI_MODEL:gpt-4o-mini}
      timeout-ms: 45000
      daily-token-budget: ${OPENAI_DAILY_TOKEN_BUDGET:0}
      monthly-token-budget: ${OPENAI_MONTHLY_TOKEN_BUDGET:0}
    gemini:
      enabled: ${GEMINI_ENABLED:true}
      base-url: https://generativelanguage.googleapis.com/v1beta/openai
      api-key: ${GEMINI_API_KEY:}
      # 2.5-flash 404s for new Gemini keys (legacy access only). 3.8-flash is the
      # current OpenAI-compat example and matches the working Gemini 3.x speech models.
      chat-model: ${GEMINI_CHAT_MODEL:gemini-3.8-flash}
      timeout-ms: 45000
      daily-token-budget: ${GEMINI_DAILY_TOKEN_BUDGET:0}
      monthly-token-budget: ${GEMINI_MONTHLY_TOKEN_BUDGET:0}
    grok:
      enabled: ${XAI_ENABLED:true}
      base-url: https://api.x.ai/v1
      api-key: ${XAI_API_KEY:}
      chat-model: ${XAI_CHAT_MODEL:grok-3-mini}
      timeout-ms: 45000
      daily-token-budget: ${XAI_DAILY_TOKEN_BUDGET:0}
      monthly-token-budget: ${XAI_MONTHLY_TOKEN_BUDGET:0}
  # Ordered provider ids. Ineligible ids (no key / disabled) are skipped automatically.
  routes:
    uz:
      default:
        - gemini
        - openai
    ru:
      default:
        - openai
        - grok
    en:
      default:
        - openai
        - grok
  memory:
    enabled: ${AI_MEMORY_ENABLED:true}
    extraction-provider: openai
    max-retrieved: 5
    min-confidence: 0.7
    temporary-ttl-minutes: 120
  speech:
    uzbek-provider: gemini
    stt-model: ${GEMINI_STT_MODEL:gemini-3.5-transcribe}
    tts-model: ${GEMINI_TTS_MODEL:gemini-3.8-flash-lite-tts}
    tts-voice: ${GEMINI_TTS_VOICE:Kore}

# Daily.co Video API configuration
# Get your API key from https://dashboard.daily.co/
# In production, set DAILY_API_KEY environment variable
daily:
  apiKey: ${DAILY_API_KEY:}    # No default: set it in the environment (.env locally). The old committed key was rotated.
  apiUrl: https://api.daily.co/v1

# AI Medical Scribe
scribe:
  # Temporary audio must not live under the publicly served storage root.
  temp-dir: ${java.io.tmpdir}/shifa-scribe-temp
  temp-retention-minutes: 60
  max-audio-size-bytes: 26214400  # 25 MB (Whisper limit)
  daily-webhook-secret: ${DAILY_WEBHOOK_SECRET:}

stripe:
  secretKey: ${STRIPE_SECRET_KEY:}
  webhookSecret: ${STRIPE_WEBHOOK_SECRET:}
  connectRefreshUrl: ${STRIPE_CONNECT_REFRESH_URL:http://localhost:8080/settings/billing}
  connectReturnUrl: ${STRIPE_CONNECT_RETURN_URL:http://localhost:8080/settings/billing}

# DevSMS — patient appointment SMS reminders (UZ). Token via env in production (never commit).
# sender-from must match the alphanumeric name approved in your DevSMS account (not 4546).
devsms:
  api-token: ${DEVSMS_API_TOKEN:}
  base-url: ${DEVSMS_BASE_URL:https://devsms.uz/api}
  sender-from: ${DEVSMS_SENDER_FROM:SHIFA UZ}
  price-per-sms-minor: ${DEVSMS_PRICE_PER_SMS_MINOR:500}
  billing-currency: ${DEVSMS_BILLING_CURRENCY:UZS}

# Click.uz — video consultation + treatment-plan bill checkout (UZS). Secrets via env in production (never commit).
payment:
  enabled-providers: ${PAYMENT_ENABLED_PROVIDERS:CLICK,STRIPE}
  hold-minutes: ${PAYMENT_HOLD_MINUTES:15}

click:
  enabled: ${CLICK_ENABLED:true}
  merchant-id: ${CLICK_MERCHANT_ID:0}
  service-id: ${CLICK_SERVICE_ID:0}
  merchant-user-id: ${CLICK_MERCHANT_USER_ID:0}
  secret-key: ${CLICK_SECRET_KEY:}
  pay-base-url: ${CLICK_PAY_BASE_URL:https://my.click.uz/services/pay}
