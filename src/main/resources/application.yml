# Base configuration, identical in every environment (roadmap 3.6).
#
# Profiles: no SPRING_PROFILES_ACTIVE means local (application-local.yml, git-ignored, is read if present);
# Railway development runs prod,dev; Railway production runs prod.
#
# Only secrets and what Railway injects (PORT, SPRING_DATASOURCE_*, RAILWAY_GIT_COMMIT_SHA) are environment
# variables. Everything else is a literal here or in application-prod.yml / application-dev.yml, so the real
# configuration can be read in one place and changing it is a PR. ConfigPolicyTest fails on any other placeholder.
# Secrets default to empty here (local: the feature is off or logged); application-prod.yml has no defaults.

spring:
  profiles:
    default: local
  datasource:
    # Local Docker (docker-compose maps 5433:5432) and CI. Railway sets SPRING_DATASOURCE_* (application-prod.yml).
    url: jdbc:postgresql://localhost:5433/shifa
    username: shifa
    password: shifa

  jpa:
    # Local convenience only; application-prod.yml sets validate. Flyway owns the schema.
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        # Loads lazy to-one/to-many relations of a result list in batches of 50 instead of one query each (P4).
        default_batch_fetch_size: 50
    open-in-view: false  # same as prod, so lazy-loading mistakes show up locally

  jackson:
    # Jackson 3 changed these defaults; the values below keep the request and response behaviour the apps were built
    # against on Jackson 2 (see ApplicationContextTest). The Kotlin module is configured in shared/config/JacksonConfig.kt.
    deserialization:
      fail-on-null-for-primitives: false
      fail-on-trailing-tokens: false
    mapper:
      sort-properties-alphabetically: false
      fix-field-name-upper-case-prefix: false
      default-view-inclusion: true
      use-getters-as-setters: true
      allow-final-fields-as-mutators: true

  data:
    web:
      pageable:
        # Keep the mode the apps were built against (Boot 3.4+ warns that the default may change to via_dto).
        serialization-mode: direct

  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    validate-migration-naming: true

  servlet:
    multipart:
      enabled: true
      max-file-size: 25MB
      max-request-size: 25MB

  # Brevo SMTP for OTP e-mails. The login is an account identifier; the password is the secret.
  # Without a password (local) e-mails are logged, not sent.
  mail:
    host: smtp-relay.brevo.com
    port: 587
    username: a77ba9001@smtp-brevo.com
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000
          starttls:
            enable: true
    from: noreply@shifa.uz
    from-name: SHIFA

# Local logging; application-prod.yml quiets it.
logging:
  level:
    root: INFO
    org.springframework.security: DEBUG
    com.shifa.shared.security.JwtAuthFilter: DEBUG
    com.shifa: DEBUG
  pattern:
    # Request id (X-Request-Id response header, shared/RequestIdFilter) next to the level on every line.
    level: "%5p [rid=%X{requestId:-}]"

server:
  # Railway injects PORT.
  port: ${PORT:8080}
  # Let in-flight requests finish during a deploy (up to the phase timeout below) instead of cutting them
  # at once; long SSE streams can still be cut after that window (roadmap 2.4).
  shutdown: graceful

spring.lifecycle.timeout-per-shutdown-phase: 30s

# OpenAPI: sorted output so docs/api/openapi.json (the committed contract, see ApplicationContextTest) diffs cleanly.
springdoc:
  writer-with-order-by-keys: true

# Actuator: /actuator/health/liveness for Railway, /actuator/info for the release workflow.
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  info:
    env:
      enabled: true

# /actuator/info: the deployed commit, set by Railway at runtime; "local" elsewhere. Used by the release workflow.
info:
  commit: ${RAILWAY_GIT_COMMIT_SHA:local}

app:
  rate-limit:
    auth:
      requests-per-minute: 10
    general:
      requests-per-minute: 200
    # X-Forwarded-For entries appended by proxies we trust (Railway edge = 1). 0 = first entry, which the client controls.
    trusted-proxy-hops: 0
    ai:
      enabled: true
      patient-daily-requests: 30
      doctor-daily-requests: 100
      patient-burst-per-min: 10
      doctor-burst-per-min: 20
      timezone: Asia/Tashkent
  jwt:
    issuer: shifa
    # Local only. application-prod.yml requires JWT_SECRET; StartupSecretChecks warns below 64 characters.
    secret: "a_really_long_random_64+_char_secret_development_only"
    accessTokenMinutesDoctor: 43200   # 30 days for the doctor app (login once per month)
    accessTokenMinutesPatient: 525600  # 365 days for the patient app
  # Files are served from the API's own domain; this is also a CORS origin.
  publicBaseUrl: http://localhost:8080
  # Where uploads live without a bucket (local, tests) and the read fallback while a volume is being copied (2.7).
  storageRoot: ./public-storage/images
  storage:
    s3:
      # Uploads go to an S3-compatible bucket when enabled (Railway Buckets); application-dev.yml turns it on.
      # The three values are Railway reference variables to the environment's own bucket (${{shifa-uploads.BUCKET}} etc.).
      enabled: false
      endpoint: https://t3.storageapi.dev
      region: auto
      bucket: ${S3_BUCKET:}
      access-key: ${S3_ACCESS_KEY:}
      secret-key: ${S3_SECRET_KEY:}
  transcription-feedback-enabled: false
  # Local only: print OTP codes to the log when SMTP is not configured.
  log-otp-codes: true
  # Private file URLs (patient documents, patient photos, chat attachments) carry exp+sig. Log-only until true.
  file-url-enforce: false
  # Upload allow-list (see shared/UploadPolicy.kt). Log-only until true.
  upload-policy-enforce: false
  # Fail-safe defaults for every profile: 500 bodies name the exception class only, no https redirect.
  # For exception messages in local 500 bodies, copy application-local.example.yml to application-local.yml.
  expose-error-details: false
  enforce-https: false
  # Deterministic test data at startup (devseed/DevSeedRunner). Only application-dev.yml and local overrides turn it on.
  dev-seed: false
  # Real mailboxes, comma-separated: admin sign-in sends its second-factor code by e-mail. Empty = no seeded admin.
  dev-seed-admin-emails: ""

openai:
  apiKey: ${OPENAI_API_KEY:}
  # Not a credential: names the OpenAI project the key bills to.
  projectId: proj_8C1hsZRHlyXzKDUc5SeSbKEq
  model: gpt-4o-mini
  # Most capable REST STT: gpt-4o-transcribe (above gpt-4o-mini-transcribe / whisper-1).
  transcription-model: gpt-4o-transcribe
  transcription-send-language-param: true
  transcription-medical-cleanup-enabled: true
  transcription-medical-cleanup-voice-uploads: false
  transcription-medical-cleanup-min-words: 10
  transcription-medical-cleanup-model: gpt-4o-mini
  url: https://api.openai.com/v1/responses
  temperature: 0.2
  maxTokens: 600
  requestTimeoutMs: 15000
  promptVersion: "1"
  maxRequestsPerMinute: 600
  # Most capable REST TTS: gpt-4o-mini-tts (falls back to tts-1-hd / tts-1 if the project lacks access).
  tts-model: gpt-4o-mini-tts
  tts-voice: sage
  tts-speed: 0.92

# Shifa Intelligence LLM routing (provider-agnostic morning assistant).
# A provider is used only when it has a non-blank API key, so a deployment without GEMINI_API_KEY / XAI_API_KEY
# stays OpenAI-only. Set enabled: false to keep a key without sending traffic.
ai:
  routing:
    enabled: true
    default-provider: openai
    max-provider-attempts: 2
    request-deadline-ms: 40000
    cooldown-ms: 60000
  providers:
    openai:
      enabled: true
      base-url: https://api.openai.com/v1
      api-key: ${OPENAI_API_KEY:}
      project-id: proj_8C1hsZRHlyXzKDUc5SeSbKEq
      chat-model: gpt-4o-mini
      timeout-ms: 45000
      daily-token-budget: 0
      monthly-token-budget: 0
    gemini:
      enabled: true
      base-url: https://generativelanguage.googleapis.com/v1beta/openai
      api-key: ${GEMINI_API_KEY:}
      # 2.5-flash 404s for new Gemini keys (legacy access only). 3.8-flash is the
      # current OpenAI-compat example and matches the working Gemini 3.x speech models.
      chat-model: gemini-3.8-flash
      timeout-ms: 45000
      daily-token-budget: 0
      monthly-token-budget: 0
    grok:
      enabled: true
      base-url: https://api.x.ai/v1
      api-key: ${XAI_API_KEY:}
      chat-model: grok-3-mini
      timeout-ms: 45000
      daily-token-budget: 0
      monthly-token-budget: 0
  # Ordered provider ids. Ineligible ids (no key / disabled) are skipped automatically.
  routes:
    uz:
      default:
        - gemini
        - openai
    ru:
      default:
        - openai
        - grok
    en:
      default:
        - openai
        - grok
  memory:
    enabled: true
    extraction-provider: openai
    max-retrieved: 5
    min-confidence: 0.7
    temporary-ttl-minutes: 120
  speech:
    uzbek-provider: gemini
    stt-model: gemini-3.5-transcribe
    tts-model: gemini-3.8-flash-lite-tts
    tts-voice: Kore

# Daily.co video rooms.
daily:
  apiKey: ${DAILY_API_KEY:}
  apiUrl: https://api.daily.co/v1

# AI Medical Scribe
scribe:
  # Temporary audio must not live under the publicly served storage root.
  temp-dir: ${java.io.tmpdir}/shifa-scribe-temp
  temp-retention-minutes: 60
  max-audio-size-bytes: 26214400  # 25 MB (Whisper limit)
  daily-webhook-secret: ${DAILY_WEBHOOK_SECRET:}

stripe:
  secretKey: ${STRIPE_SECRET_KEY:}
  webhookSecret: ${STRIPE_WEBHOOK_SECRET:}
  connectRefreshUrl: http://localhost:8080/settings/billing
  connectReturnUrl: http://localhost:8080/settings/billing

# DevSMS, patient appointment SMS (UZ). Without a token (local, development) no SMS is sent.
# sender-from must match the alphanumeric name approved in the DevSMS account.
devsms:
  api-token: ${DEVSMS_API_TOKEN:}
  base-url: https://devsms.uz/api
  sender-from: SHIFA.UZ
  price-per-sms-minor: 500
  billing-currency: UZS

payment:
  enabled-providers: CLICK,STRIPE
  hold-minutes: 15

# Click.uz checkout (UZS). The merchant identifiers appear in every public checkout URL; only the key is secret.
click:
  enabled: true
  merchant-id: 64374
  service-id: 111453
  merchant-user-id: 91085
  secret-key: ${CLICK_SECRET_KEY:}
  pay-base-url: https://my.click.uz/services/pay

# Served to every client by /api/public/config, so public by design; restrict it per app/referrer in Google Cloud.
googleMaps:
  apiKey: ${GOOGLE_MAPS_API_KEY:}
