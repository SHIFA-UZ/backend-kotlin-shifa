# Railway development environment (https://api-dev.shifa.uz).
# Activated on top of prod: SPRING_PROFILES_ACTIVE=prod,dev. Only differences from application-prod.yml belong here.

app:
  rate-limit:
    # Verified 2026-10-28 (see ARCHITECTURE_ROADMAP.md, 0.7): Railway's CDN layer REPLACES X-Forwarded-For with
    # "<client>, <cdn node>" and drops anything the client sent, so the first entry (hops 0) is the real client.
    # Tested on the public HTTPS paths only. If another ingress is opened (private networking, TCP proxy) or the
    # CDN starts appending instead of replacing, the first entry becomes spoofable again: repeat the test first.
    # Same value as production on purpose. Re-run the forged-header check before changing it.
    trusted-proxy-hops: 0

# API docs stay available on dev for the app teams.
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

logging:
  level:
    # Rate-limit diagnostics: the tail (256 chars) of X-Forwarded-For on this filter's own 429s, to notice a header
    # format change. It cannot detect evasion that never produces a 429.
    com.shifa.security.RateLimitFilter: DEBUG
