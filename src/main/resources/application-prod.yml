# Railway production (SPRING_PROFILES_ACTIVE=prod); development runs this plus application-dev.yml (prod,dev).
# Only the differences from application.yml belong here. Every placeholder is a secret or Railway-injected and has
# no default: a missing variable fails startup with its name in the log, and Railway keeps the previous deployment.

spring:
  datasource:
    # Railway reference variables to the environment's own Postgres service (roadmap 2.2).
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      # Two instances overlap during a deploy and must fit Railway Postgres together (roadmap 2.8).
      maximum-pool-size: 15
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    # Never 'update' here: schema changes go through Flyway migrations.
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
        show_sql: false

  mail:
    password: ${MAIL_PASSWORD}

logging:
  level:
    root: INFO
    com.shifa: INFO
    com.shifa.shared.security: WARN
    org.springframework.security: WARN
    org.hibernate: WARN
    org.apache.tomcat: WARN
  # stdout only: Railway captures it; a file inside the container is lost on redeploy and costs disk.

server:
  tomcat:
    threads:
      max: 100  # I/O-bound on a 15-connection pool; 1 MB stack per thread (roadmap 2.8)
  error:
    include-message: never
    include-stacktrace: never

# API docs are served by the development environment only (https://api-dev.shifa.uz/v3/api-docs).
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

app:
  jwt:
    secret: ${JWT_SECRET}
  # The domain the patient app's store builds call; also the host of every stored file URL. Changing it is a
  # separate decision (api.shifa.uz is a second domain of the same service).
  publicBaseUrl: https://shifa-doc-backend-mvp-production.up.railway.app
  frontendUrl: https://doctor.shifa.uz
  # Railway volume mount.
  storageRoot: /app/storage/images
  # Never print OTP codes in a deployed environment.
  log-otp-codes: false
  # 500 bodies name the exception class only; http is redirected to https behind the edge.
  expose-error-details: false
  enforce-https: true

openai:
  apiKey: ${OPENAI_API_KEY}

ai:
  providers:
    openai:
      api-key: ${OPENAI_API_KEY}

daily:
  apiKey: ${DAILY_API_KEY}

scribe:
  daily-webhook-secret: ${DAILY_WEBHOOK_SECRET}

stripe:
  secretKey: ${STRIPE_SECRET_KEY}
  webhookSecret: ${STRIPE_WEBHOOK_SECRET}
  connectRefreshUrl: https://shifa-doctor-staging.web.app/home
  connectReturnUrl: https://shifa-doctor-staging.web.app/profile

devsms:
  api-token: ${DEVSMS_API_TOKEN}

click:
  secret-key: ${CLICK_SECRET_KEY}

googleMaps:
  apiKey: ${GOOGLE_MAPS_API_KEY}
