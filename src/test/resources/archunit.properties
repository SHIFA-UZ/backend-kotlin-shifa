# ArchUnit FreezingArchRule: the violations that exist today are recorded in archunit-store/ and tolerated.
# A NEW violation fails the build (refreeze=false). A violation that disappears is removed from the store on the next
# run (allowStoreUpdate=true), so a cleanup PR commits the smaller store. Never set freeze.refreeze=true in CI: it would
# accept new violations silently.
freeze.store.default.path=src/test/resources/archunit-store
freeze.store.default.allowStoreCreation=true
freeze.store.default.allowStoreUpdate=true
freeze.refreeze=false
