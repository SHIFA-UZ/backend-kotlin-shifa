name: CI
on:
  push:
    # Not "production": that branch only ever receives a fast-forward of a main SHA that CI already built,
    # and a push made by the release workflow's GITHUB_TOKEN would not start a workflow run anyway.
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        # Same major version and extension as Railway (postgres-ssl:17 with pgvector).
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: shifa
          POSTGRES_USER: shifa
          POSTGRES_PASSWORD: shifa
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U shifa"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew build --no-daemon
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-reports
          path: build/reports/tests/test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: openapi
          path: build/openapi.json
          if-no-files-found: ignore
